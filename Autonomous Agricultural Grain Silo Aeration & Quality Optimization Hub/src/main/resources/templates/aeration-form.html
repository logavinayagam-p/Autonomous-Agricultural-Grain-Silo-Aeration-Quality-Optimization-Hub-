<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Grain Silo Hub'">Record Aeration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-building me-2 text-warning"></i>
                <span>Grain Silo Hub</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/silos}"><i class="bi bi-database me-1"></i> Silos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/conditions}"><i class="bi bi-thermometer-half me-1"></i> Conditions</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/aerations}"><i class="bi bi-fan me-1"></i> Aeration Logs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">

                    <!-- Back Link -->
                    <div class="mb-3">
                        <a th:href="@{/aerations}" class="text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Back to Aeration Logs
                        </a>
                    </div>

                    <!-- Card Form -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3 border-bottom">
                            <h4 class="fw-bold mb-0 text-warning text-dark" th:text="${pageTitle}">Record Aeration Activity</h4>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/aerations/save}" th:object="${aeration}" method="post">

                                <!-- Hidden ID -->
                                <input type="hidden" th:field="*{id}" />

                                <!-- Select Silo -->
                                <div class="mb-3">
                                    <label for="silo" class="form-label fw-semibold">Target Silo <span class="text-danger">*</span></label>
                                    <select class="form-select" id="silo" th:field="*{silo}" th:errorclass="is-invalid">
                                        <option value="">-- Choose Silo --</option>
                                        <option th:each="s : ${silos}" 
                                                th:value="${s.id}" 
                                                th:text="${s.siloName} + ' (' + ${s.grainType} + ' - ' + ${s.location} + ')'">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('silo')}" th:errors="*{silo}"></div>
                                </div>

                                <div class="row">
                                    <!-- Aeration Date -->
                                    <div class="col-md-6 mb-3">
                                        <label for="aerationDate" class="form-label fw-semibold">Aeration Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="aerationDate" th:field="*{aerationDate}" th:errorclass="is-invalid">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('aerationDate')}" th:errors="*{aerationDate}"></div>
                                    </div>

                                    <!-- Duration (Hours) -->
                                    <div class="col-md-6 mb-3">
                                        <label for="duration" class="form-label fw-semibold">Run Duration (Hours) <span class="text-danger">*</span></label>
                                        <div class="input-group has-validation">
                                            <input type="number" step="0.1" min="0.1" class="form-control" id="duration" 
                                                   th:field="*{duration}" placeholder="e.g. 4.0" th:errorclass="is-invalid">
                                            <span class="input-group-text">Hours</span>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Fan Status -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold d-block">Aeration Fan Status <span class="text-danger">*</span></label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="fanStatusOn" value="ON" th:field="*{fanStatus}">
                                        <label class="form-check-label text-success fw-semibold" for="fanStatusOn">
                                            <i class="bi bi-power me-1"></i> ON (Active Aeration)
                                        </label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="fanStatusOff" value="OFF" th:field="*{fanStatus}">
                                        <label class="form-check-label text-secondary fw-semibold" for="fanStatusOff">
                                            <i class="bi bi-slash-circle me-1"></i> OFF (Idle / Halted)
                                        </label>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fanStatus')}" th:errors="*{fanStatus}"></div>
                                </div>

                                <!-- Remarks -->
                                <div class="mb-4">
                                    <label for="remarks" class="form-label fw-semibold">Operational Remarks / Observations</label>
                                    <textarea class="form-control" id="remarks" th:field="*{remarks}" rows="3" 
                                              placeholder="e.g. Evening aeration cycle to lower core grain temperature following harvest."></textarea>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/aerations}" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-warning text-dark fw-semibold">
                                        <i class="bi bi-save me-1"></i> Save Aeration Activity
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-3 text-center text-muted">
        <div class="container">
            <small>Autonomous Agricultural Grain Silo Aeration & Quality Optimization Hub &bull; College Academic Prototype</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
