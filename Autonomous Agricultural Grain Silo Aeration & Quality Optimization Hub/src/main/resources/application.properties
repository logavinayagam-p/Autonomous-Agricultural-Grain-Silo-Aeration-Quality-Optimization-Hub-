# ===================================================================
# Application Configuration: Autonomous Agricultural Grain Silo Hub
# ===================================================================

# Application Port
server.port=8080

# Spring Application Name
spring.application.name=grain-silo-hub

# ===================================================================
# MySQL Database Connection Details
# Replace 'root' password if your local MySQL root password is different
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/grain_silo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=toor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Settings
# ddl-auto=update automatically creates/updates database tables based on Entity classes
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Thymeleaf Template Engine Settings
# Set cache=false so changes to HTML reflect immediately during development
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
